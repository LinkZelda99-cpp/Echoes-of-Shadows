name: Build Echoes of Shadows for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Build Echoes of Shadows
        run: |
          clang++ -std=c++17 \
            main.cpp \
            World.cpp \
            Battle.cpp \
            Player.cpp \
            Dialogue.cpp \
            -o EchoesOfShadows

      - name: Make executable
        run: chmod +x EchoesOfShadows

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfShadows-macOS
          path: EchoesOfShadows
