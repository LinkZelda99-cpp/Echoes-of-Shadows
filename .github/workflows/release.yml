name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (\${{ matrix.platform }})
    runs-on: \${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          \$tag = if ('\${{ github.event.release.tag_name }}' -ne '') { '\${{ github.event.release.tag_name }}' } else { '\${{ inputs.tag }}' }
          New-Item -ItemType Directory -Force -Path package
          Copy-Item 'build/Release/Echoes_of_Shadows.exe' 'package/Echoes_of_Shadows.exe'
          Compress-Archive -Path 'package/Echoes_of_Shadows.exe' -DestinationPath "Echoes-of-Shadows-\${tag}-Windows.zip"
          Copy-Item 'package/Echoes_of_Shadows.exe' "Echoes-of-Shadows-\${tag}-Windows.exe"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag='\${{ github.event.release.tag_name }}'
          if [ -z "$tag" ]; then tag='\${{ inputs.tag }}'; fi
          mkdir -p package
          cp build/Echoes_of_Shadows package/Echoes_of_Shadows
          cp build/Echoes_of_Shadows "Echoes-of-Shadows-$tag-\${{ matrix.platform }}"
          tar -czf "Echoes-of-Shadows-$tag-\${{ matrix.platform }}.tar.gz" -C package Echoes_of_Shadows

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Echoes-of-Shadows-\${{ matrix.platform }}
          path: Echoes-of-Shadows-*
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: Echoes-of-Shadows-*
          path: release-assets
          merge-multiple: true

      - name: Attach builds to release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Echoes-of-Shadows-*
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
