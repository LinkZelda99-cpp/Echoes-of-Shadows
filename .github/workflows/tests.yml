name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  save-test:
    name: Save system test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build game
        run: cmake --build build --config Debug

      - name: Build save test
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic             tests/SaveTests.cpp Save.cpp -o save_tests

      - name: Run save test
        run: ./save_tests
